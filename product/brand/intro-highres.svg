<svg xmlns="http://www.w3.org/2000/svg" width="990" height="254" viewBox="0 0 990 254">
  <!-- The Boost Office splash for HiDPI screens (program/intro-highres.png, the stock 990 x 254): the layout of
       intro.svg at this size. #progress goes into sofficerc as ProgressPositionHigh and ProgressSizeHigh. -->
  <rect width="990" height="254" fill="#FAFAFB"/>
  <rect x="0.5" y="0.5" width="989" height="253" fill="none" stroke="#E0E0E0"/>
  <g id="mark">
    <rect x="60" y="106" width="14" height="26" rx="3" fill="#185ABD"/>
    <rect x="82" y="93" width="14" height="39" rx="3" fill="#1B7A3E"/>
    <rect x="104" y="80" width="14" height="52" rx="3" fill="#C43E1C"/>
  </g>
  <text x="140" y="132" font-family="Inter" font-size="72" font-weight="600" fill="#242424">Boost</text>
  <text x="360.36" y="132" font-family="Inter" font-size="72" font-weight="400" fill="#242424">Office</text>
  <rect id="progress" x="60" y="190" width="870" height="12" fill="none"/>
</svg>
